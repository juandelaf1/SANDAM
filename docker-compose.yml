services:
  postgres:
    image: postgres:14-alpine
    container_name: sandam-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sandam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandam"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sandam-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:admin@postgres:5432/sandam
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      AEMET_API_KEY: ${AEMET_API_KEY:-}
      SOCIB_API_KEY: ${SOCIB_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
