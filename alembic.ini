# Alembic configuration for SANDAM.
#
# The database URL is NOT stored here. `alembic/env.py` reads it from the
# application settings (DATABASE_URL env var or .env), so no credential is
# versioned. The empty `sqlalchemy.url` below exists only because Alembic
# expects the key to be present.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime by alembic/env.py from Settings.database_url.
sqlalchemy.url =

# Migration files use plain YYYY-less sequential ids (0001, 0002, ...) to match
# the task plan. Keep `file_template` in sync with that naming.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Add formatters here if you want auto-formatting of generated revisions.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
